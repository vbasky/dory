[package]
name = "dory_ui_document"
edition.workspace = true
version.workspace = true
authors.workspace = true
description = "Document subsystem (tabs, panes, code/data/audit/chart/key-value documents) for Dory"
repository.workspace = true
homepage.workspace = true
license.workspace = true

[lib]

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
dory_ui_base.workspace = true
dory_components.workspace = true
dory_core.workspace = true
dory_app.workspace = true
dory_audit.workspace = true
dory_storage.workspace = true
dory_export.workspace = true
dory_i18n.workspace = true
dory_transfer.workspace = true
uuid.workspace = true
log.workspace = true
serde_json.workspace = true
lsp-types = { workspace = true }
anyhow = { workspace = true }
rfd.workspace = true
image.workspace = true
dory_mcp = { workspace = true, optional = true }
dory_policy = { workspace = true, optional = true }

[features]
default = []
mcp = ["dory_mcp", "dory_policy", "dory_app/mcp", "dory_ui_base/mcp"]
# `lua` and `aws` are passthroughs: no document code uses them directly, but they
# must forward to dory_app/dory_ui_base so dory_app is not built twice with
# mismatched feature sets across the workspace.
lua = ["dory_app/lua", "dory_ui_base/lua"]
aws = ["dory_app/aws", "dory_ui_base/aws"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
dory_driver_mssql = { workspace = true }
dory_test_support = { workspace = true }
