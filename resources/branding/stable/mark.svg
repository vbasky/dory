<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Dory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3BB7E0"/>
      <stop offset="100%" stop-color="#0C6798"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="128" height="128" rx="28" ry="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <rect width="128" height="128" fill="url(#sheen)"/>
    <!-- Fish body in the D counter -->
    <path fill="#1A6E96" d="
      M56 44
      Q56 40 60 40
      H71
      C91 40 95 50 95 64
      C95 78 91 88 71 88
      H60
      Q56 88 56 84
      Z"/>
    <!-- Geometric D -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="
      M38 32
      Q38 28 42 28
      H70
      C104 28 109 44 109 64
      C109 84 104 100 70 100
      H42
      Q38 100 38 96
      Z
      M56 44
      Q56 40 60 40
      H71
      C91 40 95 50 95 64
      C95 78 91 88 71 88
      H60
      Q56 88 56 84
      Z"/>
    <!-- Compact W caudal fin -->
    <path fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" d="
      M38 55
      L21 48
      L15 44
      L25 58
      L18 64
      L25 70
      L15 84
      L21 80
      L38 73
      Z"/>
    <!-- Gill slits -->
    <g fill="none" stroke="#FFFFFF" stroke-width="2.15" stroke-linecap="round">
      <path d="M62 45 L73 57"/>
      <path d="M62 52 L75 65"/>
      <path d="M62 59 L73 71"/>
    </g>
    <!-- Eye -->
    <circle cx="87.5" cy="60" r="4" fill="#F0C014"/>
    <circle cx="88.6" cy="58.9" r="1.3" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M75 70 Q82 78 90 70.5" fill="none" stroke="#0A4468" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
